services:
  db:
    image: postgres:17
    container_name: tmk_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: tmk_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      TMK_APP_PASSWORD: ${TMK_APP_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - tmk_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmk_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tmk_postgres_data: